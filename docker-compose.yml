services:
  db:
    image: postgres:16-alpine
    container_name: shawty_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: shawty_app
      POSTGRES_PASSWORD: shawty@pk
      POSTGRES_DB: shawty
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shawty_app -d shawty"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: shawty_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://shawty_app:shawty%40pk@db:5432/shawty
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: shawty_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data: